[opener]
edit = [{ run = 'nvim "$@"', block = true }]

satty = [{ run = 'satty --filename %s', orphan = true, desc = "satty" }]

haruna = [{ run = 'haruna %s', orphan = true, desc = "haruna" }]

mpv = [{ run = 'mpv %s', orphan = true, desc = "mpv" }]

picker = [
  { run = '~/scripts/open-with.sh "$@"', block = true, desc = "App Picker" },
]

handlr_picker = [
  { run = '~/scripts/handlr-open.sh', desc = "Open With (Handlr)", block = true },
]

[open]
prepend_rules = [
  { mime = "image/*", use = [
    "open",
    "satty",
  ] },
  { mime = "video/*", use = [
    "open",
    "haruna",
    "mpv",
    "picker",
    "handlr_picker",
  ] },
  { mime = "*", use = [
    "picker",
    "handlr_picker",
  ] },
]

[mgr]
sort_by = "natural"
